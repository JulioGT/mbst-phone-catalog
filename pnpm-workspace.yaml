packages:
  - "apps/*"
  - "packages/*"

# Dependency install scripts are denied unless listed here.
# Each package below ships prebuilt binaries as optional dependencies and works
# without its install script (checked when it was added), so the script is denied.
allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  esbuild: false
  simple-git-hooks: false
  unrs-resolver: false

